name: main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  patch-git:
    uses: ./.github/workflows/patch-git.yml

  clone:
    runs-on: ubuntu-latest
    needs: patch-git
    env:
      GIT_PATH: ${{ needs.patch-git.outputs.git-path }}
    steps:
      - name: Restore patched git
        uses: actions/cache@v5
        with:
          path: /opt/git
          key: ${{ runner.os }}-git
      - name: Use patched git
        run: echo "$GIT_BIN_PATH" >> $GITHUB_PATH

      - name: Checkout pepository
        uses: actions/checkout@v6
        with:
          submodules: recursive
